<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon-usage.png">
<title>API usage</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 1100px;
         margin: 48px auto; padding: 0 24px; color: #1a1a1a; }
  input { width: 100%; font: inherit; font-size: 15px; padding: 10px;
             box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button, select { padding: 8px 14px; font-size: 14px; border: 1px solid #ccc;
           border-radius: 6px; background: white; color: #1a1a1a; cursor: pointer; }
  button.primary { background: #1a1a1a; color: white; border: none; padding: 10px 20px; font-size: 15px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: #666; font-size: 13px; }
  .status { margin-top: 10px; font-size: 14px; min-height: 1.2em; color: #666; }
  .status.error { color: #b3261e; }
  #login-row { display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  #topbar { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; }
  #signout { background: none; color: #666; padding: 4px 0; font-size: 13px;
             text-decoration: underline; border: none; }
  #controls { display: flex; align-items: center; gap: 10px; margin: 20px 0 8px; }
  #totals { display: flex; flex-direction: column; gap: 18px; margin: 20px 0; }
  .totals-title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; }
  .totals-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { border: 1px solid #e5e5e5; border-radius: 8px; padding: 14px 18px; min-width: 140px; }
  .stat .label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .chart-section { margin-top: 44px; padding-top: 32px; border-top: 1px solid #e5e5e5; }
  .chart-section h3 { margin-bottom: 2px; }
  .chart-wrap { position: relative; height: 420px; margin-top: 16px; }
  .chart-wrap canvas { max-width: 100%; }
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  import { Chart } from "https://esm.sh/chart.js@4/auto";

  const SUPABASE_URL = "https://eyejmvryyiaymrlenhxa.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_QI6BiGiDmlBZwpA_TAq8Qg_uDjoKKKv";
  const HOURS_BACK = 72;
  const DAYS_BACK = 30;
  const MONTHS_BACK = 12;

  // Matches the api_usage_log activity_type values written by enrich-items,
  // ask, daily-digest, and digest-preferences-form.
  const ACTIVITY_COLORS = {
    enrichment: "#4338ca",
    headline_classification: "#8b5cf6",
    ask_query: "#0e7490",
    digest_synthesis: "#047857",
    feed_discovery: "#b45309",
  };
  const ACTIVITY_LABELS = {
    enrichment: "Enrichment",
    headline_classification: "Headline classification",
    ask_query: "Ask query",
    digest_synthesis: "Digest synthesis",
    feed_discovery: "Feed discovery",
  };
  function colorFor(activityType) {
    return ACTIVITY_COLORS[activityType] || "#666";
  }
  function labelFor(activityType) {
    return ACTIVITY_LABELS[activityType] || activityType;
  }

  const METRICS = {
    cost_usd: { label: "Cost ($)", format: (v) => `$${v.toFixed(4)}` },
    calls: { label: "Calls", format: (v) => String(Math.round(v)) },
    input_tokens: { label: "Input tokens", format: (v) => Math.round(v).toLocaleString() },
    output_tokens: { label: "Output tokens", format: (v) => Math.round(v).toLocaleString() },
  };

  const supabase = createClient(SUPABASE_URL, PUBLISHABLE_KEY);
  const app = document.getElementById("app");

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children) node.appendChild(child);
    return node;
  }

  function renderLogin() {
    app.innerHTML = "";
    const status = el("div", { class: "status" });
    const emailInput = el("input", { type: "email", placeholder: "Email", autocomplete: "username" });
    const passwordInput = el("input", { type: "password", placeholder: "Password", autocomplete: "current-password" });
    const signInBtn = el("button", {
      class: "primary",
      text: "Sign in",
      onclick: async () => {
        signInBtn.disabled = true;
        status.className = "status";
        status.textContent = "Signing in…";
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });
        if (error) {
          status.className = "status error";
          status.textContent = error.message;
          signInBtn.disabled = false;
          return;
        }
        renderApp();
      },
    });
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") signInBtn.click();
    });

    app.append(
      el("h2", { text: "API usage" }),
      el("p", { class: "hint", text: "Sign in with your Personal OS account." }),
      el("div", { id: "login-row" }, [emailInput, passwordInput, signInBtn]),
      status,
    );
  }

  // Builds the full set of hourly bucket keys for the lookback window, so
  // hours with zero calls still show up as a gap rather than being skipped
  // (the RPC only returns rows that actually have usage).
  function hourlyBucketKeys(hoursBack) {
    const keys = [];
    const now = new Date();
    now.setUTCMinutes(0, 0, 0);
    for (let i = hoursBack - 1; i >= 0; i--) {
      const d = new Date(now.getTime() - i * 60 * 60 * 1000);
      keys.push(d.toISOString().slice(0, 13));
    }
    return keys;
  }
  function keyForHourRow(row) {
    return new Date(row.hour_bucket).toISOString().slice(0, 13);
  }
  function formatHourLabel(key) {
    // key is "YYYY-MM-DDTHH"
    const d = new Date(key + ":00:00Z");
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric" });
  }

  // Same idea as hourlyBucketKeys, one key per calendar day (UTC).
  function dailyBucketKeys(daysBack) {
    const keys = [];
    const now = new Date();
    now.setUTCHours(0, 0, 0, 0);
    for (let i = daysBack - 1; i >= 0; i--) {
      const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
      keys.push(d.toISOString().slice(0, 10));
    }
    return keys;
  }
  // usage_by_day's day_bucket is a plain SQL date, which PostgREST serializes
  // as "YYYY-MM-DD" already — matches the bucket key format directly.
  function keyForDayRow(row) {
    return row.day_bucket;
  }
  function formatDayLabel(key) {
    const d = new Date(key + "T00:00:00Z");
    return d.toLocaleString(undefined, { month: "short", day: "numeric" });
  }

  // One key per calendar month (UTC), "YYYY-MM".
  function monthlyBucketKeys(monthsBack) {
    const keys = [];
    const now = new Date();
    const year = now.getUTCFullYear();
    const month = now.getUTCMonth();
    for (let i = monthsBack - 1; i >= 0; i--) {
      const d = new Date(Date.UTC(year, month - i, 1));
      keys.push(d.toISOString().slice(0, 7));
    }
    return keys;
  }
  // usage_by_month's month_bucket is the first-of-month SQL date
  // ("YYYY-MM-01") — trim to "YYYY-MM" to match the bucket key format.
  function keyForMonthRow(row) {
    return row.month_bucket.slice(0, 7);
  }
  function formatMonthLabel(key) {
    const d = new Date(key + "-01T00:00:00Z");
    return d.toLocaleString(undefined, { month: "short", year: "numeric" });
  }

  function buildChartData(rows, metric, bucketKeys, keyForRow, formatLabel) {
    const activityTypes = [...new Set(rows.map((r) => r.activity_type))].sort();

    const byActivityAndKey = {};
    for (const row of rows) {
      const key = keyForRow(row);
      byActivityAndKey[row.activity_type] ??= {};
      byActivityAndKey[row.activity_type][key] = row;
    }

    return {
      labels: bucketKeys.map(formatLabel),
      datasets: activityTypes.map((type) => ({
        label: labelFor(type),
        backgroundColor: colorFor(type),
        data: bucketKeys.map((key) => Number(byActivityAndKey[type]?.[key]?.[metric] ?? 0)),
      })),
    };
  }

  function computeTotals(rows) {
    const totals = { calls: 0, input_tokens: 0, output_tokens: 0, cost_usd: 0 };
    for (const row of rows) {
      totals.calls += Number(row.calls);
      totals.input_tokens += Number(row.input_tokens);
      totals.output_tokens += Number(row.output_tokens);
      totals.cost_usd += Number(row.cost_usd);
    }
    return totals;
  }

  function renderTotalsGroup(label, totals) {
    const stats = [
      { label: "Cost", value: `$${totals.cost_usd.toFixed(4)}` },
      { label: "Calls", value: totals.calls.toLocaleString() },
      { label: "Input tokens", value: totals.input_tokens.toLocaleString() },
      { label: "Output tokens", value: totals.output_tokens.toLocaleString() },
    ];
    const row = el("div", { class: "totals-row" });
    for (const s of stats) {
      row.append(
        el("div", { class: "stat" }, [
          el("div", { class: "label", text: s.label }),
          el("div", { class: "value", text: s.value }),
        ]),
      );
    }
    return el("div", { class: "totals-group" }, [
      el("div", { class: "totals-title", text: label }),
      row,
    ]);
  }

  function renderTotals(container, groups) {
    container.innerHTML = "";
    for (const { label, totals } of groups) {
      container.append(renderTotalsGroup(label, totals));
    }
  }

  // One chart section (hourly/daily/monthly all share this shape): a heading,
  // a canvas, and a status line. Each keeps its own Chart.js instance and
  // latest rows so the shared metric selector can redraw all three at once
  // without refetching.
  function makeChartSection({ title, hint, bucketKeys, keyForRow, formatLabel, tag }) {
    const status = el("div", { class: "status" });
    const chartWrap = el("div", { class: "chart-wrap" }, [el("canvas")]);
    const canvas = chartWrap.querySelector("canvas");
    const section = el("div", { class: "chart-section", "data-section": tag }, [
      el("h3", { text: title }),
      el("p", { class: "hint", text: hint }),
      chartWrap,
      status,
    ]);

    let chart = null;
    let latestRows = [];

    function redraw(metric) {
      const chartData = buildChartData(latestRows, metric, bucketKeys, keyForRow, formatLabel);
      if (chart) {
        chart.data = chartData;
        chart.update();
        return;
      }
      chart = new Chart(canvas, {
        type: "bar",
        data: chartData,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { maxRotation: 60, minRotation: 60, autoSkip: true, maxTicksLimit: 24 } },
            y: { stacked: true, beginAtZero: true },
          },
          plugins: { legend: { position: "bottom" } },
        },
      });
    }

    return {
      element: section,
      setRows(rows, emptyMessage) {
        latestRows = rows;
        status.textContent = rows.length
          ? `Updated ${new Date().toLocaleTimeString()}`
          : emptyMessage;
      },
      setError(message) {
        status.className = "status error";
        status.textContent = message;
      },
      redraw,
    };
  }

  async function renderApp() {
    app.innerHTML = "";

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      renderLogin();
      return;
    }

    const signOutBtn = el("button", {
      id: "signout",
      text: "Sign out",
      onclick: async () => {
        await supabase.auth.signOut();
        renderLogin();
      },
    });

    const status = el("div", { class: "status" });
    const totalsBox = el("div", { id: "totals" });

    const metricSelect = el("select", {});
    for (const [key, { label }] of Object.entries(METRICS)) {
      metricSelect.append(el("option", { value: key, text: label }));
    }

    const hourlySection = makeChartSection({
      title: "Last 72 hours (hourly)",
      hint: `Claude API calls over the last ${HOURS_BACK} hours, by activity type.`,
      bucketKeys: hourlyBucketKeys(HOURS_BACK),
      keyForRow: keyForHourRow,
      formatLabel: formatHourLabel,
      tag: "hourly",
    });
    const dailySection = makeChartSection({
      title: "Last 30 days (daily)",
      hint: `API calls per day over the last ${DAYS_BACK} days, by activity type.`,
      bucketKeys: dailyBucketKeys(DAYS_BACK),
      keyForRow: keyForDayRow,
      formatLabel: formatDayLabel,
      tag: "daily",
    });
    const monthlySection = makeChartSection({
      title: "Last 12 months (monthly)",
      hint: `API calls per month over the last ${MONTHS_BACK} months, by activity type.`,
      bucketKeys: monthlyBucketKeys(MONTHS_BACK),
      keyForRow: keyForMonthRow,
      formatLabel: formatMonthLabel,
      tag: "monthly",
    });
    const sections = [hourlySection, dailySection, monthlySection];

    function redrawAll() {
      const metric = metricSelect.value;
      for (const s of sections) s.redraw(metric);
    }
    metricSelect.addEventListener("change", redrawAll);

    const refreshBtn = el("button", {
      text: "Refresh",
      onclick: () => load(true),
    });

    async function load(isRefresh) {
      status.className = "status";
      status.textContent = isRefresh ? "Refreshing…" : "Loading…";
      refreshBtn.disabled = true;
      try {
        const [hourly, daily, monthly] = await Promise.all([
          supabase.rpc("usage_by_hour", { hours_back: HOURS_BACK }),
          supabase.rpc("usage_by_day", { days_back: DAYS_BACK }),
          supabase.rpc("usage_by_month", { months_back: MONTHS_BACK }),
        ]);
        if (hourly.error) throw new Error(hourly.error.message);
        if (daily.error) throw new Error(daily.error.message);
        if (monthly.error) throw new Error(monthly.error.message);

        const hourlyRows = hourly.data || [];
        const dailyRows = daily.data || [];
        hourlySection.setRows(hourlyRows, `No API usage recorded in the last ${HOURS_BACK}h.`);
        dailySection.setRows(dailyRows, `No API usage recorded in the last ${DAYS_BACK} days.`);
        monthlySection.setRows(monthly.data || [], `No API usage recorded in the last ${MONTHS_BACK} months.`);

        // Last 24h is a subset of the 72h hourly rows already fetched, and
        // "last month" reads as a rolling 30 days (consistent with the 72h
        // and 24h windows also being rolling, not calendar-aligned) — both
        // reuse data already on hand rather than needing their own RPC call.
        const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
        const last24hRows = hourlyRows.filter((r) => new Date(r.hour_bucket).getTime() >= dayAgo);
        renderTotals(totalsBox, [
          { label: "Last 24 hours", totals: computeTotals(last24hRows) },
          { label: "Last 72 hours", totals: computeTotals(hourlyRows) },
          { label: "Last 30 days", totals: computeTotals(dailyRows) },
        ]);
        redrawAll();
        status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        status.className = "status error";
        status.textContent = err.message || "Something went wrong.";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    app.append(
      el("div", { id: "topbar" }, [el("h2", { text: "API usage" }), signOutBtn]),
      el("p", { class: "hint", text: "Totals below cover three rolling windows." }),
      el("div", { id: "controls" }, [metricSelect, refreshBtn]),
      totalsBox,
      status,
      hourlySection.element,
      dailySection.element,
      monthlySection.element,
    );

    load(false);
  }

  renderApp();
</script>
</body>
</html>
